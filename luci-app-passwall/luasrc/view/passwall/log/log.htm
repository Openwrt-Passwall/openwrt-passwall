<%
local api = require "luci.passwall.api"
local section_tag = api.is_js_luci() and "div" or "fieldset"
-%>
<%+header%>
<script type="text/javascript">
	//<![CDATA[
	var log_textarea = null;
	var first_load_done = false;

	function scrollToBottom() {
		log_textarea.scrollTop = log_textarea.scrollHeight;
	}

	function clearlog(btn) {
		XHR.get('<%=api.url("clear_log")%>', null,
			function(x, data) {
				if(x && x.status == 200 && log_textarea) {
					log_textarea.innerHTML = "";
					scrollToBottom();
				}
			}
		);
	}

	XHR.poll(2, '<%=api.url("get_log")%>', null,
		function(x, data) {
			if(x && x.status == 200) {
				if (!log_textarea) log_textarea = document.getElementById('log_textarea');
				var wasBottom = (log_textarea.scrollTop + log_textarea.clientHeight >= log_textarea.scrollHeight - 10);
				log_textarea.innerHTML = x.responseText;
				if (!first_load_done) {
					scrollToBottom();
					first_load_done = true;
				}
				else if (wasBottom) {
					scrollToBottom();
				}
			}
		}
	);
	//]]>
</script>
<<%=section_tag%> class="cbi-section" id="_log_fieldset">
	<input class="btn cbi-button cbi-button-remove" type="button" onclick="clearlog()" value="<%:Clear logs%>" />
	<textarea id="log_textarea" class="cbi-input-textarea"
		style="width: 100%; margin-top: 10px; white-space: pre !important; overflow-x: auto !important;"
		data-update="change" rows="40" wrap="off" readonly="readonly"></textarea>
</<%=section_tag%>>
<%+footer%>

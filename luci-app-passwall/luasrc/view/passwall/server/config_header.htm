<%
local map = self.map
local api = map.api
local section = self.section
-%>
<style>
	[id*="_users"] .cbi-dropdown li[data-value="-"],
	[id*="_users"] .cbi-dropdown input[type="text"],
	[id*="_users"] .cbi-dropdown .preview li[data-value="-"] {
		display: none !important;
	}
</style>
<script type="text/javascript">
	//<![CDATA[
	function server_update_config(cfgid, data, redirect_url) {
		XHR.get('<%=api.url("server_update_config")%>', {
			id: cfgid,
			data: JSON.stringify(data)
		},
		function(x, data) {
			if (x && x.status == 200 && data.code == 1) {
				if (redirect_url) {
					window.location.href = redirect_url;
				}
			}
			else {
				alert("<%:Error%>");
			}
		});
	}
	//]]>
</script>
